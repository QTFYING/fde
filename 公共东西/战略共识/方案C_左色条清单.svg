<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="100%" role="img">
<title>方案C 左色条清单</title>
<defs><marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style>
<text x="40" y="56" font-size="11" fill="#BA7517" letter-spacing="3">战略共识 · STRATEGIC CONSENSUS</text>
<rect x="40" y="66" width="36" height="3" fill="#BA7517"/>
<text x="40" y="102" font-size="20" fill="#0C447C" font-weight="600">AI 时代的组织能力：用「反馈迭代」代替「严格执行」</text>
<rect x="40" y="138" width="3" height="60" fill="#185FA5"/>
<text x="58" y="152" font-size="13" fill="#BA7517">01</text>
<text x="92" y="152" font-size="15" fill="#0C447C" font-weight="600">从「人工复盘」走向数据驱动的自动循环</text>
<text x="92" y="174" font-size="12" fill="#5F5E5A">传统公司靠人工复盘调整；未来的公司用数据 + 智能体 + 质量反馈机制自动循环。</text>
<text x="92" y="195" font-size="11" fill="#888780">发现问题 <tspan fill="#BA7517">→</tspan> 分析原因 <tspan fill="#BA7517">→</tspan> 补工具 / 改规则 <tspan fill="#BA7517">→</tspan> 持续优化</text>
<rect x="40" y="214" width="3" height="60" fill="#185FA5"/>
<text x="58" y="228" font-size="13" fill="#BA7517">02</text>
<text x="92" y="228" font-size="15" fill="#0C447C" font-weight="600">竞争不是「人多」，而是「闭环多」</text>
<text x="92" y="250" font-size="12" fill="#5F5E5A">增长、销售、客服、研发、内容、运营——每个闭环都要具备完整的迭代能力。</text>
<text x="92" y="271" font-size="11" fill="#888780">感知 <tspan fill="#BA7517">→</tspan> 决策 <tspan fill="#BA7517">→</tspan> 执行 <tspan fill="#BA7517">→</tspan> 评估 <tspan fill="#BA7517">→</tspan> 学习</text>
<rect x="40" y="290" width="3" height="60" fill="#185FA5"/>
<text x="58" y="304" font-size="13" fill="#BA7517">03</text>
<text x="92" y="304" font-size="15" fill="#0C447C" font-weight="600">企业级上下文，成为新基建</text>
<text x="92" y="326" font-size="12" fill="#5F5E5A">客户理解、业务规则、历史决策、产品路线图，要沉淀为公司资产。</text>
<text x="92" y="347" font-size="11" fill="#888780">散落在人脑和文档里，AI 就无法真正接管工作</text>
<rect x="40" y="366" width="3" height="60" fill="#185FA5"/>
<text x="58" y="380" font-size="13" fill="#BA7517">04</text>
<text x="92" y="380" font-size="15" fill="#0C447C" font-weight="600">按「AI 可读」的方式建立公司</text>
<text x="92" y="402" font-size="12" fill="#5F5E5A">所有业务工作都被记录、关键知识被结构化、流程能被数据调用。</text>
<text x="92" y="423" font-size="11" fill="#888780">失败能反馈 <tspan fill="#BA7517">→</tspan> 经验能沉淀</text>
</svg>
