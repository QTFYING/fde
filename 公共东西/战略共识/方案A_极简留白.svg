<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 455" width="100%" role="img">
<title>方案A 极简留白 舒朗版</title>
<defs><marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style>
<text x="40" y="56" font-size="11" fill="#BA7517" letter-spacing="3">战略共识 · STRATEGIC CONSENSUS</text>
<rect x="40" y="66" width="36" height="3" fill="#BA7517"/>
<text x="40" y="102" font-size="20" fill="#0C447C" font-weight="600">AI 时代的组织能力：用「反馈迭代」代替「严格执行」</text>
<text x="40" y="170" font-size="34" fill="#C9DCF0" font-weight="500">01</text>
<text x="115" y="150" font-size="15"><tspan fill="#BA7517">机制引擎</tspan><tspan fill="#B4B2A9"> · </tspan><tspan fill="#0C447C" font-weight="600">从"人工复盘"走向"数据驱动的自动循环"</tspan></text>
<text x="115" y="172" font-size="12" fill="#5F5E5A">传统公司靠人工复盘调整，未来的公司用数据 + 智能体 + 质量反馈机制自动循环。</text>
<text x="115" y="193" font-size="11" fill="#888780">发现问题 <tspan fill="#BA7517">→</tspan> 分析原因 <tspan fill="#BA7517">→</tspan> 补工具 / 改规则 <tspan fill="#BA7517">→</tspan> 持续优化</text>
<line x1="40" y1="208" x2="640" y2="208" stroke="#ECE9E0" stroke-width="0.5"/>
<text x="40" y="254" font-size="34" fill="#C9DCF0" font-weight="500">02</text>
<text x="115" y="234" font-size="15"><tspan fill="#BA7517">闭环竞争</tspan><tspan fill="#B4B2A9"> · </tspan><tspan fill="#0C447C" font-weight="600">竞争"不是人多"，而是"闭环多"</tspan></text>
<text x="115" y="256" font-size="12" fill="#5F5E5A">增长、销售、客服、研发、内容、运营——每个闭环都要具备完整的迭代能力。</text>
<text x="115" y="277" font-size="11" fill="#888780">感知 <tspan fill="#BA7517">→</tspan> 决策 <tspan fill="#BA7517">→</tspan> 执行 <tspan fill="#BA7517">→</tspan> 评估 <tspan fill="#BA7517">→</tspan> 学习</text>
<line x1="40" y1="292" x2="640" y2="292" stroke="#ECE9E0" stroke-width="0.5"/>
<text x="40" y="338" font-size="34" fill="#C9DCF0" font-weight="500">03</text>
<text x="115" y="318" font-size="15"><tspan fill="#BA7517">上下文新基建</tspan><tspan fill="#B4B2A9"> · </tspan><tspan fill="#0C447C" font-weight="600">企业级上下文，成为新基建</tspan></text>
<text x="115" y="340" font-size="12" fill="#5F5E5A">客户理解、业务规则、历史决策、产品路线图，都需要沉淀为公司资产。</text>
<text x="115" y="359" font-size="12" fill="#5F5E5A">业务规则散落在人脑和文档里，AI 就无法真正接管工作。</text>
<line x1="40" y1="376" x2="640" y2="376" stroke="#ECE9E0" stroke-width="0.5"/>
<text x="40" y="422" font-size="34" fill="#C9DCF0" font-weight="500">04</text>
<text x="115" y="402" font-size="15"><tspan fill="#BA7517">AI 可读</tspan><tspan fill="#B4B2A9"> · </tspan><tspan fill="#0C447C" font-weight="600">按"AI 可读"的方式建立公司</tspan></text>
<text x="115" y="424" font-size="12" fill="#5F5E5A">所有业务工作都记录、关键知识结构化、流程都被数据调用——失败能反馈，经验能沉淀。</text>
</svg>
