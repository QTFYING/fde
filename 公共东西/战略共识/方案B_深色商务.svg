<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 465" width="100%" role="img">
<title>方案B 深色商务 宽卡片版</title>
<defs><marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D9A441" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style>
<rect x="0" y="0" width="680" height="465" fill="#07203C"/>
<text x="40" y="56" font-size="11" fill="#D9A441" letter-spacing="3">战略共识 · STRATEGIC CONSENSUS</text>
<rect x="40" y="66" width="36" height="3" fill="#D9A441"/>
<text x="40" y="104" font-size="20" fill="#F2F5F9" font-weight="600">AI 时代的组织能力：用「反馈迭代」代替「严格执行」</text>
<rect x="30" y="130" width="300" height="116" rx="12" fill="#0B2A4A"/>
<rect x="46" y="146" width="26" height="3" fill="#D9A441"/>
<text x="80" y="151" font-size="12" fill="#D9A441">01</text>
<text x="46" y="172" font-size="13" fill="#F2F5F9" font-weight="600">从"人工复盘"走向"数据驱动的自动循环"</text>
<text x="46" y="194" font-size="12" fill="#9DB2C7">传统公司靠人工复盘调整，未来的公司用</text>
<text x="46" y="212" font-size="12" fill="#9DB2C7">数据 + 智能体 + 质量反馈机制自动循环。</text>
<text x="46" y="234" font-size="11" fill="#D9A441">发现问题→分析原因→补工具 / 改规则→持续优化</text>
<rect x="350" y="130" width="300" height="116" rx="12" fill="#0B2A4A"/>
<rect x="366" y="146" width="26" height="3" fill="#D9A441"/>
<text x="400" y="151" font-size="12" fill="#D9A441">02</text>
<text x="366" y="172" font-size="13" fill="#F2F5F9" font-weight="600">竞争"不是人多"，而是"闭环多"</text>
<text x="366" y="194" font-size="12" fill="#9DB2C7">增长、销售、客服、研发、内容、运营……</text>
<text x="366" y="212" font-size="12" fill="#9DB2C7">每个闭环都要具备完整的迭代能力。</text>
<text x="366" y="234" font-size="11" fill="#D9A441">感知 → 决策 → 执行 → 评估 → 学习</text>
<rect x="30" y="286" width="300" height="116" rx="12" fill="#0B2A4A"/>
<rect x="46" y="302" width="26" height="3" fill="#D9A441"/>
<text x="80" y="307" font-size="12" fill="#D9A441">03</text>
<text x="46" y="328" font-size="13" fill="#F2F5F9" font-weight="600">企业级上下文，成为新基建</text>
<text x="46" y="350" font-size="12" fill="#9DB2C7">客户理解、业务规则、历史决策、产品路线图，</text>
<text x="46" y="368" font-size="12" fill="#9DB2C7">都需要沉淀为公司资产。业务规则散落在人脑</text>
<text x="46" y="386" font-size="12" fill="#9DB2C7">和文档里，AI 就无法真正接管工作。</text>
<rect x="350" y="286" width="300" height="116" rx="12" fill="#0B2A4A"/>
<rect x="366" y="302" width="26" height="3" fill="#D9A441"/>
<text x="400" y="307" font-size="12" fill="#D9A441">04</text>
<text x="366" y="328" font-size="13" fill="#F2F5F9" font-weight="600">按"AI 可读"的方式建立公司</text>
<text x="366" y="350" font-size="12" fill="#9DB2C7">所有业务工作都记录、关键知识结构化、流程</text>
<text x="366" y="368" font-size="12" fill="#9DB2C7">都被数据调用——失败能反馈，经验能沉淀。</text>
</svg>
