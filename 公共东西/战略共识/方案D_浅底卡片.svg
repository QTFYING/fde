<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 450" width="100%" role="img">
<title>方案D 浅底卡片</title>
<defs><marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B37414" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}</style>
<text x="40" y="56" font-size="11" fill="#BA7517" letter-spacing="3">战略共识 · STRATEGIC CONSENSUS</text>
<rect x="40" y="66" width="36" height="3" fill="#BA7517"/>
<text x="40" y="102" font-size="20" fill="#0C447C" font-weight="600">AI 时代的组织能力：用「反馈迭代」代替「严格执行」</text>
<rect x="40" y="140" width="290" height="130" rx="14" fill="#EAF2FB"/>
<rect x="60" y="156" width="34" height="20" rx="6" fill="#185FA5"/>
<text x="77" y="170" font-size="11" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="104" y="170" font-size="14" fill="#0C447C" font-weight="600">机制引擎</text>
<text x="60" y="200" font-size="12" fill="#5F5E5A">从「人工复盘」走向数据驱动的自动循环，</text>
<text x="60" y="218" font-size="12" fill="#5F5E5A">数据 + 智能体 + 质量反馈，自动循环。</text>
<text x="60" y="248" font-size="11" fill="#8A7A55">发现问题 <tspan fill="#B37414">→</tspan> 分析原因 <tspan fill="#B37414">→</tspan> 补工具 / 改规则 <tspan fill="#B37414">→</tspan> 持续优化</text>
<rect x="350" y="140" width="290" height="130" rx="14" fill="#FBF2E0"/>
<rect x="370" y="156" width="34" height="20" rx="6" fill="#B37414"/>
<text x="387" y="170" font-size="11" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="414" y="170" font-size="14" fill="#0C447C" font-weight="600">闭环竞争</text>
<text x="370" y="200" font-size="12" fill="#5F5E5A">竞争不是「人多」，而是「闭环多」。</text>
<text x="370" y="218" font-size="12" fill="#5F5E5A">每个闭环都要具备完整的迭代能力。</text>
<text x="370" y="248" font-size="11" fill="#8A7A55">感知 <tspan fill="#B37414">→</tspan> 决策 <tspan fill="#B37414">→</tspan> 执行 <tspan fill="#B37414">→</tspan> 评估 <tspan fill="#B37414">→</tspan> 学习</text>
<rect x="40" y="290" width="290" height="130" rx="14" fill="#FBF2E0"/>
<rect x="60" y="306" width="34" height="20" rx="6" fill="#B37414"/>
<text x="77" y="320" font-size="11" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="104" y="320" font-size="14" fill="#0C447C" font-weight="600">上下文新基建</text>
<text x="60" y="350" font-size="12" fill="#5F5E5A">客户理解、业务规则、历史决策，</text>
<text x="60" y="368" font-size="12" fill="#5F5E5A">产品路线图——沉淀为公司资产。</text>
<text x="60" y="398" font-size="11" fill="#8A7A55">散落即失效，沉淀即资产</text>
<rect x="350" y="290" width="290" height="130" rx="14" fill="#EAF2FB"/>
<rect x="370" y="306" width="34" height="20" rx="6" fill="#185FA5"/>
<text x="387" y="320" font-size="11" fill="#FFFFFF" text-anchor="middle">04</text>
<text x="414" y="320" font-size="14" fill="#0C447C" font-weight="600">AI 可读公司</text>
<text x="370" y="350" font-size="12" fill="#5F5E5A">工作全记录、知识结构化、流程被数据</text>
<text x="370" y="368" font-size="12" fill="#5F5E5A">调用——失败能反馈，经验能沉淀。</text>
<text x="370" y="398" font-size="11" fill="#8A7A55">全记录 <tspan fill="#B37414">→</tspan> 结构化 <tspan fill="#B37414">→</tspan> 被调用 <tspan fill="#B37414">→</tspan> 反馈</text>
</svg>
